<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Covert Mask — Masar Stores</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5a5a5a;
    --line: #e5e5e5;
    --accent: #0f62fe;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    margin: 0;
    line-height: 1.6;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 96px 24px 64px;
    text-align: center;
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    margin: 0 auto 28px;
  }
  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .tag {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 8px;
  }
  .org {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
  }
  .links {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .links a:hover {
    background: #fafafa;
    border-color: #d0d0d0;
  }
  footer {
    margin-top: 64px;
    font-size: 13px;
    color: #9a9a9a;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">CM</div>
  <h1>Covert Mask</h1>
  <p class="tag">Internal content-publishing automation.</p>
  <p class="org">Built and operated by Masar Stores · Barka, Oman</p>

  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>

  <footer>
    &copy; 2026 Masar Stores. Not a public product — internal use only.
  </footer>
</div>
</body>
</html>
